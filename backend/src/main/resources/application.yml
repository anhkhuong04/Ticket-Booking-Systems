spring:
  application:
    name: lak-backend
  profiles:
    default: local
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${BACKEND_PORT:8080}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "timestamp=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level logger=%logger{36} request_id=%X{request_id:-} booking_code=%X{booking_code:-} payment_id=%X{payment_id:-} message=%msg%n"
  level:
    root: ${LOG_LEVEL:INFO}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    poll-interval: ${OUTBOX_POLL_INTERVAL:1s}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:8}
    initial-backoff: ${OUTBOX_INITIAL_BACKOFF:5s}
    max-backoff: ${OUTBOX_MAX_BACKOFF:15m}
    processing-timeout: ${OUTBOX_PROCESSING_TIMEOUT:2m}
  reservation:
    hold-ttl: ${SEAT_HOLD_TTL:5m}
    idempotency-ttl: ${SEAT_HOLD_IDEMPOTENCY_TTL:24h}
    expiry-poll-interval: ${SEAT_HOLD_EXPIRY_POLL_INTERVAL:20s}
    expiry-batch-size: ${SEAT_HOLD_EXPIRY_BATCH_SIZE:100}
  booking:
    checkout-idempotency-ttl: ${BOOKING_CHECKOUT_IDEMPOTENCY_TTL:24h}
    payment-grace-period: ${PAYMENT_GRACE_PERIOD:2m}
  payment:
    reconciliation-poll-interval: ${PAYMENT_RECONCILIATION_POLL_INTERVAL:30s}
    reconciliation-batch-size: ${PAYMENT_RECONCILIATION_BATCH_SIZE:100}
    sandbox:
      checkout-base-url: ${SANDBOX_PAYMENT_CHECKOUT_URL:http://localhost:5173/payments/sandbox}
      webhook-secret: ${SANDBOX_PAYMENT_WEBHOOK_SECRET:local-development-secret-must-be-replaced}
  ticketing:
    qr-signing-secret: ${TICKET_QR_SIGNING_SECRET:local-development-ticket-qr-secret-must-be-replaced}
    resend-rate-limit: ${TICKET_RESEND_RATE_LIMIT:3}
    resend-rate-limit-window: ${TICKET_RESEND_RATE_LIMIT_WINDOW:15m}
  notification:
    email:
      enabled: ${MAIL_ENABLED:false}
      provider: ${MAIL_PROVIDER:disabled}
      endpoint: ${MAIL_ENDPOINT:}
      api-token: ${MAIL_API_TOKEN:}
      from-address: ${MAIL_FROM_ADDRESS:}
  media:
    cloudinary:
      enabled: ${CLOUDINARY_ENABLED:false}
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      folder: ${CLOUDINARY_FOLDER:lak-movies}
      max-upload-megabytes: ${CLOUDINARY_MAX_UPLOAD_MEGABYTES:5}
  auth:
    jwt-hmac-secret: ${JWT_HMAC_SECRET}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:7d}
    password-reset-token-ttl: ${PASSWORD_RESET_TOKEN_TTL:30m}
    password-reset-url: ${PASSWORD_RESET_URL:http://localhost:5173/reset-password}
    refresh-cookie-name: ${REFRESH_COOKIE_NAME:lak_refresh_token}
    csrf-cookie-name: ${CSRF_COOKIE_NAME:lak_csrf_token}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    login-rate-limit: ${LOGIN_RATE_LIMIT:5}
    login-rate-limit-window: ${LOGIN_RATE_LIMIT_WINDOW:1m}
